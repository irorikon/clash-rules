name: Build geosite.dat and Clash Meta MRS
on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Compare latest tags and set variables
        run: |
          upstreamLatestTag=$(curl -fsSL --connect-timeout 5 --retry 5 -H "Accept: application/vnd.github+json" "https://api.github.com/repos/v2fly/domain-list-community/releases?per_page=1" | jq -r '.[0].tag_name // empty')
          thisLatestTag=$(curl -fsSL --connect-timeout 5 --retry 5 -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases?per_page=1" | jq -r '.[0].tag_name // empty')
          if [[ -z "$upstreamLatestTag" ]]; then
            echo "::error::Could not determine the latest upstream release tag."
            exit 1
          fi
          echo "NeedToSync=false" >> "$GITHUB_ENV"
          if [[ $upstreamLatestTag != $thisLatestTag ]]; then
            echo "NeedToSync=true" >> "$GITHUB_ENV"
          fi
          echo "RELEASE_NAME=$upstreamLatestTag" >> "$GITHUB_ENV"
          echo "TAG_NAME=$upstreamLatestTag" >> "$GITHUB_ENV"
        shell: bash

      - name: Checkout codebase
        uses: actions/checkout@v7
        if: ${{ env.NeedToSync }}

      - name: Setup Go
        uses: actions/setup-go@v7
        if: ${{ env.NeedToSync }}
        with:
          go-version-file: ./go.mod

      - name: Checkout v2fly/domain-list-community
        if: ${{ env.NeedToSync }}
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          path: domain-list-community

      - name: Append attribute rules
        if: ${{ env.NeedToSync }}
        run: |
          echo "include:geolocation-!cn @cn" >> ./domain-list-community/data/cn
          echo "include:geolocation-cn @!cn" >> ./domain-list-community/data/geolocation-\!cn

      - name: Generate categorized rule lists
        if: ${{ env.NeedToSync }}
        run: |
          go run ./ \
            --datapath=./domain-list-community/data \
            --exportlists=icloud,private,tld-!cn

      - name: Generate Clash rule categories
        if: ${{ env.NeedToSync }}
        run: bash ./.github/scripts/generate-rules.sh ./publish

      - name: Generate sha256 hashsum
        if: ${{ env.NeedToSync }}
        run: |
          cd publish || exit 1
          sha256sum geosite.dat > geosite.dat.sha256sum
          sha256sum *.mrs > mrs.sha256sum
          sha256sum *.txt > rules.sha256sum

      - name: Git push assets to "release" branch
        if: ${{ env.NeedToSync }}
        run: |
          cd publish || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add publish "https://${{ github.actor }}:${{ secrets.CLASH_RULE_PAT }}@github.com/${{ github.repository }}"
          git push -f publish release

      - name: Release and upload assets
        if: ${{ env.NeedToSync }}
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            ./publish/geosite.dat
            ./publish/geosite.dat.sha256sum
            ./publish/*.txt
            ./publish/*.mrs
            ./publish/mrs.sha256sum
            ./publish/rules.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.CLASH_RULE_PAT }}
